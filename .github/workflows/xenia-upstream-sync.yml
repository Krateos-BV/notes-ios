name: Xenia Upstream Sync

# Periodically checks nextcloud/notes-ios:main for commits we don't have yet and
# opens a PR so they get triaged instead of silently piling up. This fork has diverged
# on branding/config/release plumbing, so this workflow deliberately NEVER merges
# anything automatically - it only surfaces what upstream has and lets a human decide
# per commit whether it's safe to pull in.
#
# If the merge attempt below hits conflicts, the PR is still opened with the conflict
# markers committed as-is so the diff shows exactly what needs manual resolution,
# rather than silently skipping the sync.

on:
  schedule:
    # Every Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Look up the sync PR and attempt the merge, but do not push or open a PR'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  upstream-sync:
    runs-on: ubuntu-latest

    steps:
      # GITHUB_TOKEN cannot create or update files under .github/workflows/ - that is a
      # GitHub security boundary, not a `permissions:` setting (`workflows` is not a
      # permission a workflow can request). Upstream merges regularly touch workflow
      # files, so the sync push was rejected server-side with
      #   refusing to allow a GitHub App to create or update workflow ... without
      #   `workflows` permission
      # A GitHub App installation token can hold `workflows: write`, so mint one per run.
      # It is also short-lived and not tied to anyone's personal account, unlike a PAT.
      #
      # Second benefit: a PR opened with GITHUB_TOKEN does not trigger `pull_request`
      # workflows, so sync PRs would have arrived with no CI at all. An App token's PR
      # does trigger them. (XNT-184)
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The App's client ID is an identifier, not a secret (read it with:
          # gh api /apps/xenia-upstream-sync --jq .client_id).
          client-id: Iv23li86RZXU8iKG6Dx1
          private-key: ${{ secrets.XENIA_SYNC_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream
        run: git remote add upstream https://github.com/nextcloud/notes-ios.git && git fetch upstream main

      - name: Check for new upstream commits
        id: check
        run: |
          count=$(git rev-list --count HEAD..upstream/main)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count new upstream commit(s)"

      # --repo is load-bearing. Without it gh resolves the repository from the git remotes
      # and, with no TTY, prefers the remote named `upstream` (added above) over `origin`,
      # so it searched nextcloud/* for our sync PR, never found it, force-pushed over the
      # open PR's branch and then failed with "A pull request already exists". (XEN-284)
      - name: Check for an existing open sync PR
        id: existing
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UPSTREAM_COUNT: ${{ steps.check.outputs.count }}
        run: |
          open_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head upstream-sync/main --json number --jq '.[0].number // ""')
          echo "pr=$open_pr" >> "$GITHUB_OUTPUT"
          if [ -n "$open_pr" ]; then
            # An open sync PR may carry human conflict resolutions, so it is never
            # overwritten. Skip loudly instead of silently.
            msg="Sync PR #$open_pr is still open in $GITHUB_REPOSITORY - leaving upstream-sync/main untouched. $UPSTREAM_COUNT upstream commit(s) are pending; merge or close #$open_pr and the next run picks them up."
            echo "::notice title=Upstream sync skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No open sync PR with head upstream-sync/main in $GITHUB_REPOSITORY."
          fi

      - name: Configure git identity
        if: steps.check.outputs.count != '0' && steps.existing.outputs.pr == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Attempt merge of upstream/main
        id: merge
        if: steps.check.outputs.count != '0' && steps.existing.outputs.pr == ''
        run: |
          # Base tip the sync branch is cut from, for the commit list below.
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git checkout -b upstream-sync/main
          if git merge upstream/main --no-edit; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            git add -A
            git commit -m "chore: merge nextcloud/notes-ios main (conflicts need manual resolution)"
          fi

      - name: List upstream commits
        id: log
        if: steps.check.outputs.count != '0' && steps.existing.outputs.pr == ''
        env:
          BASE_SHA: ${{ steps.merge.outputs.base }}
        run: |
          # Listed against the pre-merge base: after the merge HEAD contains
          # upstream/main, so HEAD..upstream/main is empty. Capped so a large sync
          # stays under GitHub's 65,536-character PR body limit.
          total=$(git rev-list --count "$BASE_SHA..upstream/main")
          log=$(git log --max-count=300 --format='- %h %s' "$BASE_SHA..upstream/main")
          if [ "$total" -gt 300 ]; then
            log="$log
          - ... and $((total - 300)) more (git log $BASE_SHA..upstream/main)"
          fi
          {
            echo "log<<EOF"
            echo "$log"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: steps.check.outputs.count != '0' && steps.existing.outputs.pr == '' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # The branch is workflow-owned and no open PR uses it (checked above), so it may be
          # replaced - but only if it is still exactly what checkout fetched (or still absent).
          # A commit pushed to it since then makes this push fail instead of vanishing. (XEN-284)
          expected=$(git rev-parse -q --verify "refs/remotes/origin/upstream-sync/main" || true)
          echo "Replacing upstream-sync/main (lease: ${expected:-must not exist}) with $(git rev-parse HEAD)"
          git push --force-with-lease="upstream-sync/main:${expected}" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" upstream-sync/main

      # Created via the REST API rather than `gh pr create`: the CLI goes through the
      # GraphQL createPullRequest mutation, which refused an App installation token with
      # "Resource not accessible by integration" even with pull_requests: write granted.
      # The REST endpoint accepts the same token. (XNT-184)
      - name: Open PR
        if: steps.check.outputs.count != '0' && steps.existing.outputs.pr == '' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UPSTREAM_COUNT: ${{ steps.check.outputs.count }}
          UPSTREAM_LOG: ${{ steps.log.outputs.log }}
          MERGE_CLEAN: ${{ steps.merge.outputs.clean }}
        run: |
          status_line="This merge was clean."
          # A code fence keeps upstream commit subjects inert: an @mention or an
          # owner/repo#N reference would otherwise notify people or leave a
          # cross-reference on the upstream issue. Four backticks so a subject
          # containing a three-backtick fence cannot close it.
          fence='````'
          if [ "$MERGE_CLEAN" != "true" ]; then
            status_line="**This merge has unresolved conflicts** (committed as-is with conflict markers) - resolve them on this branch before merging."
          fi

          body=$(cat <<EOF
          Automated sync check against [nextcloud/notes-ios](https://github.com/nextcloud/notes-ios) main.

          $status_line

          This PR is never auto-merged - review each commit for conflicts with our branding, bundle ID, CalVer versioning, and release plumbing before merging.

          Merge it with **Create a merge commit** - never squash or rebase. Either drops the upstream ancestry, and the same upstream commits then come back in the next sync (XEN-256).

          ## Upstream commits

          ${fence}text
          $UPSTREAM_LOG
          ${fence}
          EOF
          )

          jq -n \
            --arg title "Upstream sync: $UPSTREAM_COUNT new commit(s) from nextcloud/notes-ios" \
            --arg head "upstream-sync/main" \
            --arg base "main" \
            --arg body "$body" \
            '{title: $title, head: $head, base: $base, body: $body}' \
          | gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" --input - \
              --jq '"Opened PR #\(.number): \(.html_url)"'

      - name: Dry run report
        if: steps.check.outputs.count != '0' && steps.existing.outputs.pr == '' && inputs.dry_run == true
        env:
          UPSTREAM_COUNT: ${{ steps.check.outputs.count }}
          MERGE_CLEAN: ${{ steps.merge.outputs.clean }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          msg="DRY RUN: would replace upstream-sync/main in $GITHUB_REPOSITORY with $(git rev-parse --short HEAD) and open a PR against $BASE ($UPSTREAM_COUNT upstream commit(s), clean merge: $MERGE_CLEAN). Nothing was pushed."
          echo "::notice title=Upstream sync dry run::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      # Drift alarm (XEN-308). While a sync PR stays open, every later run only writes
      # a notice, so the fork could fall far behind without anyone seeing it. This step
      # turns the run red (visible in Actions and in the failure email) when the drift
      # passes a limit. It runs last, so the sync PR is still opened or kept first.
      #   - pending upstream commits above MAX_PENDING
      #   - the open sync PR older than MAX_PR_AGE_DAYS
      #   - the newest upstream release tag not in main MAX_RELEASE_LAG_DAYS after it
      #     was cut (we merge upstream releases, not the tip)
      - name: Drift alarm
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UPSTREAM_COUNT: ${{ steps.check.outputs.count }}
          OPEN_PR: ${{ steps.existing.outputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MAX_PENDING: '40'
          MAX_PR_AGE_DAYS: '35'
          MAX_RELEASE_LAG_DAYS: '21'
        run: |
          problems=0
          now=$(date +%s)
          main_sha=$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")

          if [ "$UPSTREAM_COUNT" -gt "$MAX_PENDING" ]; then
            echo "::error title=Upstream drift::$UPSTREAM_COUNT upstream commits are not in $DEFAULT_BRANCH (limit $MAX_PENDING)."
            problems=$((problems + 1))
          fi

          if [ -n "$OPEN_PR" ]; then
            created=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$OPEN_PR" --jq .created_at)
            age=$(( (now - $(date -d "$created" +%s)) / 86400 ))
            if [ "$age" -gt "$MAX_PR_AGE_DAYS" ]; then
              echo "::error title=Upstream drift::Sync PR #$OPEN_PR has been open $age days (limit $MAX_PR_AGE_DAYS)."
              problems=$((problems + 1))
            fi
          fi

          # Newest plain release tag upstream (35.2.2, v25.0.2; no alpha/beta/rc). The tag
          # is fetched into its own ref namespace so it never touches our own tags.
          latest=$(git ls-remote --tags --refs upstream \
            | awk '{sub("refs/tags/", "", $2); print $2}' \
            | grep -E '^v?[0-9]+(\.[0-9]+)+$' \
            | awk '{k = $0; sub(/^v/, "", k); print k " " $0}' \
            | sort -V -k1,1 | tail -n 1 | cut -d' ' -f2)
          if [ -n "$latest" ]; then
            git fetch -q --no-tags upstream "+refs/tags/$latest:refs/upstream-release/$latest"
            if git merge-base --is-ancestor "refs/upstream-release/$latest" "$main_sha"; then
              echo "Latest upstream release $latest is in $DEFAULT_BRANCH."
            else
              tag_age=$(( (now - $(git log -1 --format=%ct "refs/upstream-release/$latest")) / 86400 ))
              if [ "$tag_age" -gt "$MAX_RELEASE_LAG_DAYS" ]; then
                echo "::error title=Upstream drift::Upstream release $latest ($tag_age days old) is not in $DEFAULT_BRANCH (limit $MAX_RELEASE_LAG_DAYS days)."
                problems=$((problems + 1))
              else
                echo "::notice title=Upstream release pending::$latest ($tag_age days old) is not in $DEFAULT_BRANCH yet."
              fi
            fi
          fi

          echo "Drift: $UPSTREAM_COUNT pending, open sync PR: ${OPEN_PR:-none}, latest upstream release: ${latest:-none}." >> "$GITHUB_STEP_SUMMARY"
          [ "$problems" -eq 0 ]
