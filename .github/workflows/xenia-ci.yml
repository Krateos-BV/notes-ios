name: Xenia CI

# XNT-215: `pull_request:` added 26 Sep 2026. This built `main` on push but had no
# PR trigger at all, the mirror of talk-ios — a regression reached `main` before
# anything compiled it, and the build could never gate a PR.
#
# XNT-215: `pull_request:` carries no `paths:` filter, deliberately. GitHub cannot
# distinguish a required status check that never ran from one still pending — it
# blocks the PR indefinitely either way, with no diagnostic. So a `paths:`-filtered
# or push-only check must never be made required. Every PR compiles even when only
# docs changed; that is the price of a signal that cannot silently go missing.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select latest installed Xcode
        run: |
          # Pick the newest Xcode present on the runner instead of hard-coding a
          # path, so the job keeps working as runner images change.
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          LATEST=${LATEST:-/Applications/Xcode.app}
          echo "Selecting $LATEST"
          sudo xcode-select --switch "$LATEST"

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project iOCNotes.xcodeproj \
            -scheme iOCNotes

      - name: Build (unsigned, simulator destination)
        run: |
          xcodebuild build \
            -project iOCNotes.xcodeproj \
            -scheme iOCNotes \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Locate built .app
        run: find build/Build/Products -maxdepth 2 -type d -name "*.app"

      - name: Upload built .app
        uses: actions/upload-artifact@v4
        with:
          name: iOCNotes-app
          path: build/Build/Products/**/*.app
