name: Xenia CI

on:
  push:
    branches:
      - xenia-rebrand
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select latest installed Xcode
        run: |
          # Pick the newest Xcode present on the runner instead of hard-coding a
          # path, so the job keeps working as runner images change.
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          LATEST=${LATEST:-/Applications/Xcode.app}
          echo "Selecting $LATEST"
          sudo xcode-select --switch "$LATEST"

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project iOCNotes.xcodeproj \
            -scheme iOCNotes

      - name: Build (unsigned, simulator destination)
        run: |
          xcodebuild build \
            -project iOCNotes.xcodeproj \
            -scheme iOCNotes \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload built .app
        uses: actions/upload-artifact@v4
        with:
          name: iOCNotes-app
          path: build/Build/Products/Debug-iphonesimulator/iOCNotes.app
