# XeniaCloud release — signed App Store archive, .ipa export and TestFlight upload. XNT-214.
#
# Tag push `YY.M.D` (MARKETING_VERSION, the CalVer scheme from XNT-143) archives,
# exports and uploads. workflow_dispatch archives and exports only, unless `upload`
# is ticked — so signing can be proven on `main` without putting a build on
# TestFlight. Same reasoning as XNT-198 on talk-desktop. Promotion from TestFlight
# to App Review stays manual in App Store Connect.
#
# Signing is manual end to end (XNT-213, XNT-251 findings) -- neither Archive nor
# Export ever asks Apple for anything via Cloud Managed Signing. ExportOptions.plist's
# signingCertificate/provisioningProfiles keys only apply under signingStyle=manual
# (per `xcodebuild -help`), and under automatic, export relied entirely on Cloud
# Managed Signing to create an App Store distribution profile via the ASC API key,
# which that key cannot do (likely requires a human Account Holder action) -- every
# attempt failed with "Cloud signing permission error".
#
# Archive looked safe left on CODE_SIGN_STYLE=Automatic with -allowProvisioningUpdates
# -- a *Development* profile/certificate, not the Distribution one Export needs, so it
# seemed like a different code path -- but every hosted-runner run throws its keychain
# away afterwards, so Cloud Managed Signing mints a brand-new Development certificate
# on every single run and never revokes one. XNT-251: this eventually hit the Apple
# account's overall certificate quota ("Choose a certificate to revoke") and broke the
# 26.10.4 tag release outright.
#
# The fix for both steps: import a real Distribution certificate (manually created,
# stored as APPLE_DIST_CERT_P12) and a manually-created "Xenia Notes App Store"
# provisioning profile (APPLE_PROFILE_NOTES), referenced explicitly by name, with no
# -allowProvisioningUpdates and no Cloud Managed Signing involved anywhere in this
# workflow. Secrets live in Infisical and are synced into GitHub secrets. An unscoped
# or unsynced secret resolves to an EMPTY STRING, not an error (XNT-184), so every one
# is asserted non-empty before use.
#
# CODE_SIGN_STYLE/CODE_SIGN_IDENTITY/PROVISIONING_PROFILE_SPECIFIER are set on the
# iOCNotes target's Release build configuration in project.pbxproj, NOT passed as
# `xcodebuild archive KEY=value` command-line overrides. A command-line override
# applies to every target in the whole build graph, including the synthesized
# resource-bundle targets for each resolved Swift package (Alamofire_Alamofire,
# NextcloudKit_NextcloudKitUI, etc.) -- XNT-251 tried that first and Archive failed
# with "X does not support provisioning profiles, but provisioning profile ... has
# been manually specified" for six different package targets. Scoping the settings
# to the one native target in project.pbxproj avoids touching those entirely.
#
# CFBundleVersion is CURRENT_PROJECT_VERSION as committed. App Store Connect
# rejects a second upload with the same version and build number, so bump it
# (XNT-143's derived build number) before re-tagging.

name: Xenia release (App Store)

on:
  push:
    tags:
      - '[0-9][0-9].[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Also upload to TestFlight (otherwise archive and export only)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SCHEME: iOCNotes
  BRAND_NAME: Xenia Notes
  KEYCHAIN_NAME: xenia-release.keychain-db

jobs:
  release:
    name: Archive, export and upload
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Required secrets are present
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          APPLE_PROFILE_NOTES: ${{ secrets.APPLE_PROFILE_NOTES }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_DIST_CERT_P12 APPLE_DIST_CERT_PASSWORD APPLE_PROFILE_NOTES; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty or not available to this repository"
              missing=1
            fi
          done
          exit $missing

      - name: Select latest installed Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          LATEST=${LATEST:-/Applications/Xcode.app}
          echo "Selecting $LATEST"
          sudo xcode-select --switch "$LATEST"
          xcodebuild -version

      - name: Tag matches MARKETING_VERSION
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          marketing_version=$(xcodebuild -showBuildSettings -project iOCNotes.xcodeproj -scheme "$SCHEME" \
            -configuration Release 2>/dev/null | sed -n 's/^ *MARKETING_VERSION = //p' | head -1)
          if [ "$marketing_version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match MARKETING_VERSION $marketing_version"
            exit 1
          fi

      # --- Signing identity: import the distribution certificate into a
      # temporary, job-scoped keychain so it never touches the runner's
      # default login keychain and is gone whether or not the job succeeds.
      # Mirrors talk-ios's xenia-release.yml (XNT-213).
      - name: Import distribution certificate into a temporary keychain
        env:
          APPLE_DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/${{ env.KEYCHAIN_NAME }}"

          echo "$APPLE_DIST_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$APPLE_DIST_CERT_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # --- Manually-created App Store distribution profile (XNT-213 finding:
      # Cloud Managed Signing cannot create one via API key alone). Installed
      # here so Export can reference it explicitly by name under manual
      # signing instead of asking Apple to create one on the fly.
      - name: Install App Store provisioning profile
        env:
          APPLE_PROFILE_NOTES: ${{ secrets.APPLE_PROFILE_NOTES }}
        run: |
          set -euo pipefail
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          tmp_profile=$(mktemp)
          tmp_plist=$(mktemp)
          echo "$APPLE_PROFILE_NOTES" | base64 --decode > "$tmp_profile"
          security cms -D -i "$tmp_profile" > "$tmp_plist"
          uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$tmp_plist")
          cp "$tmp_profile" "$PROFILES_DIR/$uuid.mobileprovision"
          rm -f "$tmp_profile" "$tmp_plist"
          echo "Installed Xenia Notes App Store -> $uuid.mobileprovision"

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key_dir="$HOME/private_keys"
          mkdir -p "$key_dir"
          printf '%s\n' "$ASC_KEY_P8" > "$key_dir/AuthKey_$ASC_KEY_ID.p8"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project iOCNotes.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/XeniaNotes.xcarchive" \
            -skipPackagePluginValidation \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Write ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" \
            -c "Add :destination string export" \
            -c "Add :signingStyle string manual" \
            -c "Add :signingCertificate string 'Apple Distribution'" \
            -c "Add :teamID string $APPLE_TEAM_ID" \
            -c "Add :manageAppVersionAndBuildNumber bool false" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:eu.xeniacloud.notes string 'Xenia Notes App Store'" \
            "$options"
          echo "--- ExportOptions.plist ---"
          cat "$options"
          echo "EXPORT_OPTIONS_PATH=$options" >> "$GITHUB_ENV"

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/XeniaNotes.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -exportPath "$RUNNER_TEMP/export"
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa)
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      # Checked on the shipped bundle, not the xcconfig: a localized InfoPlist.strings
      # overrides the plist at runtime, which is how "Nextcloud Notes" survived in the
      # local-network prompt after the plist itself had been rebranded.
      - name: Verify the exported app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          unpacked="$RUNNER_TEMP/unpacked"
          unzip -q "$IPA_PATH" -d "$unpacked"
          app=$(ls -d "$unpacked"/Payload/*.app)
          fail=0

          display_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Info.plist")
          if [ "$display_name" != "$BRAND_NAME" ]; then
            echo "::error::Bundle name is '$display_name', expected '$BRAND_NAME'"
            fail=1
          fi

          leftovers=$( { plutil -p "$app/Info.plist"; for f in "$app"/*.lproj/InfoPlist.strings; do plutil -p "$f"; done; } \
            | grep -iE 'nextcloud (gmbh|notes)' || true)
          if [ -n "$leftovers" ]; then
            echo "::error::Upstream branding in the shipped Info.plist or InfoPlist.strings:"
            echo "$leftovers"
            fail=1
          fi

          team=$(codesign -dv "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          if [ "$team" != "$APPLE_TEAM_ID" ]; then
            echo "::error::Signed by team '$team', expected APPLE_TEAM_ID"
            fail=1
          fi
          codesign --verify --deep --strict "$app" || fail=1

          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' "$app/Info.plist"
          exit $fail

      - name: Upload .ipa
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: XeniaNotes-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      - name: Upload to TestFlight
        if: github.ref_type == 'tag' || inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up temporary keychain and API key
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -rf "$HOME/private_keys" || true
